[project]
name = "oink"
version = "0.3.1"
description = "Self-hosted personal finance with AI reports and a real glass UI."
license = "AGPL-3.0-or-later"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "sqlalchemy>=2.0.36",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "argon2-cffi>=23.1",
    "python-multipart>=0.0.12",
    "httpx>=0.27",
    "pyjwt[crypto]>=2.9",
    "pypdf>=5.1",
    "litellm>=1.52",
    "alembic>=1.20.1",
    "cryptography>=50.0.2",
    "redis>=5.2",
]

[project.scripts]
oink = "oink.app:main"

[dependency-groups]
dev = ["pytest>=8.3", "pytest-asyncio>=0.24", "ruff>=0.8", "mypy>=1.13"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/oink"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003", "B008"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true
plugins = ["pydantic.mypy"]

[tool.ruff.lint.per-file-ignores]
"src/oink/demo.py" = ["E501"]
"src/oink/services/layouts.py" = ["E501"]  # bank layouts: long patterns read better on one line
"tests/*" = ["E501"]
"src/oink/api/mcp.py" = ["E501"]
"src/oink/api/planning.py" = ["E501"]
"src/oink/providers/directory.py" = ["E501"]
"src/oink/migrations/*" = ["E501"]
"src/oink/services/verify.py" = ["E501"]  # one rule per line, in five languages
"src/oink/services/stores.py" = ["E501"]
"src/oink/services/review.py" = ["E501"]
"src/oink/services/fixed.py" = ["E501"]  # Cypher reads better on one line
