name: Release
# Push a tag like v0.2.0: the image is built for amd64 and arm64, pushed to GHCR as that
# version and as latest, and a GitHub release is published (running Oinks see it and offer
# «Install and restart»).
on:
  push:
    tags: ["v*"]
permissions:
  contents: write
  packages: write
jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Version
        id: v
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: VERSION=${{ steps.v.outputs.version }}
          tags: |
            ghcr.io/peppe37/oink:${{ steps.v.outputs.version }}
            ghcr.io/peppe37/oink:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
  engine:
    # The documents engine (Docling + BGE-M3): amd64 only, PyTorch CPU wheels.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Version
        id: v
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v7
        with:
          context: engine
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/peppe37/oink-engine:${{ steps.v.outputs.version }}
            ghcr.io/peppe37/oink-engine:latest
          cache-from: type=gha,scope=engine
          cache-to: type=gha,mode=max,scope=engine
  release:
    needs: [image, engine]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --generate-notes --title "Oink ${GITHUB_REF_NAME#v}"
